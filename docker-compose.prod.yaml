services:
  redis:
    image: redis:latest
    container_name: wangohan_redis
    restart: always
  server:
    container_name: wangohan_server
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 3001:3001
    volumes:
      - ./backend:/app
      - server_node_modules:/app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - POSTGRES_USER=$${{POSTGRES_USER}}
      - POSTGRES_PASSWORD=$${{POSTGRES_PASSWORD}}
      - POSTGRES_PORT=$${{POSTGRES_PORT}}
      - POSTGRES_DATABASE=$${{POSTGRES_DATABASE}}
      - POSTGRES_HOST=$${{POSTGRES_HOST}}
      - AWS_ACCESS_KEY_ID=$${{AWS_ACCESS_KEY_ID}}
      - AWS_SECRET_ACCESS_KEY=$${{AWS_SECRET_ACCESS_KEY}}
      - CF_ACCOUNT_ID=$${{CF_ACCOUNT_ID}}
      - CF_BUCKET=$${{CF_BUCKET}}
      - BASE_URL=$${{BASE_URL}}
      - BASE_PUBLIC_BUCKET_URL=$${{BASE_PUBLIC_BUCKET_URL}}
      - BASE_WEB_INTERNAL_URL=$${{BASE_WEB_INTERNAL_URL}}
      - BASE_SERVER_INTERNAL_URL=$${{BASE_SERVER_INTERNAL_URL}}
      - GOOGLE_AUTH_CALLBACK_URL=$${{GOOGLE_AUTH_CALLBACK_URL}}
      - GOOGLE_CLIENT_SECRET=$${{GOOGLE_CLIENT_SECRET}}
      - GOOGLE_CLIENT_ID=$${{GOOGLE_CLIENT_ID}}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server.rule=Host(`wangohan.victorchiong.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.server.entrypoints=websecure"
      - "traefik.http.routers.server.tls.certresolver=myresolver"
      - "traefik.http.services.server.loadbalancer.server.port=3001"
  web:
    container_name: wangohan_web
    build: 
      context: ./web
      dockerfile: Dockerfile
      target: production
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PUBLIC_ORIGIN=$${{NEXT_PUBLIC_ORIGIN}}
      - NEXT_PUBLIC_BUCKET_URL=$${{NEXT_PUBLIC_BUCKET_URL}}
    ports:
      - 3002:3000
    depends_on:
      - server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`wangohan.victorchiong.com`) && PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=myresolver"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
volumes:
  web_node_modules:
  server_node_modules:
  letsencrypt:
networks:
  default:
    external: true
    name: dokploy-network