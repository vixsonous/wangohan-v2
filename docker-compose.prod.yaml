services:
  server:
    container_name: wangohan_server
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    ports:
      - 3001:3001
    volumes:
      - ./backend:/app
      - server_node_modules:/app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server.rule=Host(`wangohanjp.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.server.entrypoints=websecure"
      - "traefik.http.routers.server.tls.certresolver=myresolver"
      - "traefik.http.services.server.loadbalancer.server.port=3001"
    networks:
      - dokploy-network
  web:
    container_name: wangohan_web
    networks:
      - dokploy-network
    env_file:
      - ./.env
    build: 
      context: ./web
      dockerfile: Dockerfile
      target: production
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    ports:
      - 3002:3000
    depends_on:
      - server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`wangohanjp.com`) && PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=myresolver"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
volumes:
  web_node_modules:
  server_node_modules:
  letsencrypt:
networks:
  default:
    external: true
    name: dokploy-network